name: Update iRacing Data

on:
  schedule:
    # Ejecutar cada 2 horas (puedes cambiar esto)
    #- cron: '0 */2 * * *'  # Cada 2 horas
    - cron: '0 0 */1 * *'  # Cada día a medianoche
    # - cron: '0 0 * * 0'    # Cada domingo a medianoche
  
  # También permitir ejecución manual desde GitHub
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Necesario para hacer push al repositorio
    
    steps:
    # Paso 1: Checkout de branch_actions (CAMBIO CLAVE)
    - name: 🚀 Checkout repository
      uses: actions/checkout@v4
      with:
        ref: branch_actions  # 🔥 TRABAJAR EN ESTA RAMA
        token: ${{ secrets.GITHUB_TOKEN }}
    
    # Paso 2: Configurar Python
    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    # Paso 3: Instalar dependencias
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-update.txt
        pip install pydantic
    
    # NUEVO PASO: Mostrar en qué rama estamos trabajando
    - name: 🌟 Show current branch
      run: |
        echo "Current branch: $(git branch --show-current)"
        echo "Repository: ${{ github.repository }}"
        echo "Working in: branch_actions"
    
    # Paso 4: Ejecutar el script de actualización
    - name: 📥 Update iRacing data
      env:
        PASS: ${{ secrets.PASS }}
      run: |
        echo "🔄 Starting data update on branch_actions at $(date)"
        python update_data.py
        echo "✅ Data update completed at $(date)"
    
    # Paso 5: Verificar si hay cambios en los datos
    - name: 🔍 Check for changes
      id: changes
      run: |
        if git diff --quiet data/; then
          echo "has_changes=false" >> $GITHUB_OUTPUT
          echo "No changes detected in data files"
        else
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "Changes detected in data files"
          echo "Changed files:"
          git diff --name-only data/
        fi
    
    # Paso 6: Configurar Git para el commit (solo si hay cambios)
    - name: ⚙️ Configure Git
      if: steps.changes.outputs.has_changes == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
    
    # Paso 7: Commit y push a branch_actions (CAMBIO CLAVE)
    - name: 📤 Commit and push to branch_actions
      if: steps.changes.outputs.has_changes == 'true'
      run: |
        echo "Committing updated data files to branch_actions..."
        git add data/
        git commit -m "🔄 Auto-update iRacing data - $(date '+%Y-%m-%d %H:%M:%S UTC')"
        git push origin branch_actions  # 🔥 PUSH ESPECÍFICO A ESTA RAMA
        echo "✅ Data files updated successfully in branch_actions!"
    
    # Paso 8: Mostrar mensaje si no hay cambios
    - name: ℹ️ No changes message
      if: steps.changes.outputs.has_changes == 'false'
      run: |
        echo "📝 No changes detected in data files."
        echo "🌟 branch_actions is up to date!"
    
    # Paso 9: Subir archivos como artifacts
    - name: 📋 Upload data files as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: iracing-data-files-${{ github.run_number }}
        path: data/
        retention-days: 7
        compression-level: 6
    
    # Paso 10: Mostrar estadísticas de los archivos actualizados
    - name: 📊 Show file statistics
      run: |
        echo "=== File Statistics (branch_actions) ==="
        if [ -d "data" ]; then
          for file in data/*.csv; do
            if [ -f "$file" ]; then
              echo "📄 $(basename "$file"): $(wc -l < "$file") lines, $(du -h "$file" | cut -f1)"
            fi
          done
        else
          echo "No data directory found"
        fi
        echo "========================================="
    
    # Paso 11: Comentario en caso de fallo
    - name: 💬 Comment on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const message = `❌ **iRacing Data Update Failed**
          
          The scheduled data update workflow failed at ${new Date().toISOString()}.
          Target branch: branch_actions
          
          Please check the [workflow logs](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.`;
          
          console.log('Workflow failed:', message);
    
    # --- NUEVO PASO FINAL: Reportar el estado de la actualización ---
    - name: 📝 Report update status
      # Usamos if: always() para que este paso se ejecute incluso si los anteriores fallan
      if: always()
      run: |
        # Obtenemos el estado del job (será 'success', 'failure', etc.)
        JOB_STATUS=${{ job.status }}
        
        # Creamos un archivo JSON con la fecha actual en UTC y el estado
        echo "{\"last_update_utc\": \"$(date -u -Iseconds)\", \"status\": \"$JOB_STATUS\"}" > update_status.json
        
        # Mostramos el contenido para debugging
        cat update_status.json
        
        # Hacemos commit de este archivo de estado.
        # Esto se hace en un commit separado para asegurar que se suba incluso si no hay cambios en la data.
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add update_status.json
        # Usamos --allow-empty para crear un commit incluso si el archivo de estado no cambió (ej. dos fallos seguidos)
        git commit -m "📝 Report workflow status: $JOB_STATUS" --allow-empty
        git push origin branch_actions
